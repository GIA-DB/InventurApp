<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestandserfassung</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

input{
    padding:10px;
    margin:10px 0;
    width:100%;
    box-sizing:border-box;
}

button{
    padding:10px;
    margin:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

td,th{
    border:1px solid #ccc;
    padding:8px;
}

#reader{
    max-width:400px;
}
</style>
</head>

<body>

<h1>Bestandserfassung</h1>

<h2>Barcode scannen</h2>

<div id="reader"></div>

<label>Barcode</label>
<input id="barcode" readonly>

<label>Bestand</label>
<input id="bestand" type="number" min="0">

<button onclick="hinzufuegen()">
    Hinzufügen
</button>

<button onclick="csvExport()">
    CSV Export
</button>

<table>
    <thead>
        <tr>
            <th>Barcode</th>
            <th>Bestand</th>
        </tr>
    </thead>

    <tbody id="daten">

    </tbody>
</table>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>

let artikel = [];

function hinzufuegen(){

    const barcode =
        document.getElementById("barcode").value.trim();

    const bestand =
        Number(document.getElementById("bestand").value);

    if(!barcode || isNaN(bestand)){
        return;
    }

    let vorhanden =
        artikel.find(a => a.barcode === barcode);

    if(vorhanden){
        vorhanden.bestand += bestand;
    }
    else{
        artikel.push({
            barcode: barcode,
            bestand: bestand
        });
    }

    anzeigeAktualisieren();

    document.getElementById("barcode").value = "";
    document.getElementById("bestand").value = "";
}

function anzeigeAktualisieren(){

    let html = "";

    artikel.forEach(a => {

        html += `
        <tr>
            <td>${a.barcode}</td>
            <td>${a.bestand}</td>
        </tr>
        `;

    });

    document.getElementById("daten").innerHTML = html;
}

function csvExport(){

    let csv = "Barcode;Bestand\n";

    artikel.forEach(a => {

        csv +=
            a.barcode + ";" +
            a.bestand + "\n";

    });

    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "bestand.csv";

    link.click();

    URL.revokeObjectURL(link.href);
}

document
.getElementById("bestand")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        hinzufuegen();
    }

});

function scannerErfolg(decodedText){

    document.getElementById("barcode").value = decodedText;

    document.getElementById("bestand").focus();
}

const html5QrCode =
    new Html5Qrcode("reader");

html5QrCode.start(
    { facingMode: "environment" },
    {
        fps: 10,
        qrbox: 250
    },
    scannerErfolg
).catch(err => {
    console.error(err);
});

</script>

</body>
</html>
