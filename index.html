<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestandserfassung</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
    display:flex;
    flex-direction:column;
    min-height:calc(100vh - 40px);
    min-height:calc(100dvh - 40px);
}

h1{
    text-align:center;
}

input{
    padding:10px;
    margin:10px 0;
    width:100%;
    box-sizing:border-box;
}

button{
    padding:10px;
    margin:5px;
}

#aktionsButtons{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
}

#hinzufuegenButton{
    width:100%;
    box-sizing:border-box;
    margin:5px 0;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

td,th{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

#reader{
    position:relative;
    width:100%;
    max-width:400px;
    aspect-ratio:16/9;
    overflow:hidden;
    margin-bottom:10px;
    margin-top:10px;
}

#bestandHinweis{
    position:absolute;
    top:50%;
    left:50%;
    z-index:2;
    width:90%;
    max-width:calc(100% - 24px);
    padding:8px 12px;
    margin:0;
    box-sizing:border-box;
    transform:translate(-50%, -50%);
    background:rgba(255,255,255,0.9);
    color:#333;
    border-radius:4px;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
    pointer-events:none;
}

#csvVorLoeschen{
    width:auto;
    margin:0 8px 0 0;
}

#reader > video{
    position:absolute;
}

#statistikBereich{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top: auto;
    font-size:0.75em;
}

#statistikAnzeige{
    margin:0;
}

#statistikZuruecksetzenButton{
    flex-shrink:0;
}
</style>
</head>

<body>

<h1>InventurApp</h1>

<label>Barcode scannen</label>

<div id="reader">
    <p id="bestandHinweis" role="status" aria-live="polite" hidden></p>
</div>

<label>Artikelnummer</label>
<input id="barcode" type="text" inputmode="numeric" maxlength="8" autocomplete="off">

<label>Bestand</label>
<input id="bestand" type="number" min="0" disabled>

<button id="hinzufuegenButton" type="button" onclick="hinzufuegen()">
    Hinzufügen
</button>

<div id="aktionsButtons">
<button onclick="csvExport()">
    CSV Export
</button>

<button id="lichtButton" type="button" disabled>
    Licht nicht verfügbar
</button>
</div>

<span id="lichtStatus" aria-live="polite"></span>

<table>
    <thead>
        <tr>
            <th>Artikelnummer</th>
            <th>Bestand</th>
            <th>Aktion</th>
        </tr>
    </thead>

    <tbody id="daten">

    </tbody>
</table>

<button id="alleEintraegeLoeschenButton" type="button">
    Alle Einträge löschen
</button>

<dialog id="alleEintraegeLoeschenDialog" aria-labelledby="loeschenTitel">
    <form id="alleEintraegeLoeschenForm">
        <h2 id="loeschenTitel">Alle Einträge löschen?</h2>
        <p>Diese Aktion löscht die gesamte gespeicherte Liste und kann nicht rückgängig gemacht werden.</p>
        <label>
            <input id="csvVorLoeschen" type="checkbox">
            Vor dem Löschen eine CSV-Datei herunterladen
        </label>
        <div>
            <button type="button" id="loeschenAbbrechenButton">Abbrechen</button>
            <button type="submit">Alle Einträge endgültig löschen</button>
        </div>
    </form>
</dialog>

<div id="statistikBereich">
    <pre id="statistikAnzeige" aria-live="polite"></pre>
    <button id="statistikZuruecksetzenButton" type="button">
        Statistik zurücksetzen
    </button>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>

let artikel = JSON.parse(localStorage.getItem("artikel")) || [];

const statistikSpeicherSchluessel = "inventurStatistik";

function statistikAusArtikelnErstellen(){

    const erfassteBarcodes = [];
    const bestandJeBarcode = {};
    let gesamtbestand = 0;

    artikel.forEach(a => {
        const bestand = Number(a.bestand);

        if(!Number.isFinite(bestand)){
            throw new Error("Ungültiger gespeicherter Bestand für Artikel " + a.barcode);
        }

        gesamtbestand += bestand;
        bestandJeBarcode[a.barcode] =
            (bestandJeBarcode[a.barcode] || 0) + bestand;

        if(!erfassteBarcodes.includes(a.barcode)){
            erfassteBarcodes.push(a.barcode);
        }
    });

    return {
        artikel: erfassteBarcodes.length,
        gesamtbestand: gesamtbestand,
        erfassteBarcodes: erfassteBarcodes,
        bestandJeBarcode: bestandJeBarcode,
    };
}

let statistik = JSON.parse(
    localStorage.getItem(statistikSpeicherSchluessel)
);

if(statistik === null){
    statistik = statistikAusArtikelnErstellen();
    localStorage.setItem(
        statistikSpeicherSchluessel,
        JSON.stringify(statistik)
    );
}

anzeigeAktualisieren();
statistikAnzeigeAktualisieren();

function statistikSpeichern(){

    localStorage.setItem(
        statistikSpeicherSchluessel,
        JSON.stringify(statistik)
    );
    statistikAnzeigeAktualisieren();
}

function statistikAnzeigeAktualisieren(){

    const format = new Intl.NumberFormat("de-DE");
    document.getElementById("statistikAnzeige").textContent =
        "Erfasste Artikel: " + format.format(statistik.artikel) + "\n" +
        "Erfasster Gesamtbestand: " + format.format(statistik.gesamtbestand);
}

function statistikErfassen(barcode, bestand){

    const vorherigerBestand =
        statistik.bestandJeBarcode[barcode] || 0;

    statistik.gesamtbestand += bestand - vorherigerBestand;
    statistik.bestandJeBarcode[barcode] = bestand;

    if(!statistik.erfassteBarcodes.includes(barcode)){
        statistik.erfassteBarcodes.push(barcode);
        statistik.artikel += 1;
    }

    statistikSpeichern();
}

let bestandAusstehend = false;
let blitzlicht = null;
let lichtEingeschaltet = false;
let bestandHinweisTimeout = null;
let scannerFreigabeTimeout = null;
let scannerSperrzeitAktiv = false;
const scannerSperrzeitDauer = 1500;
const bestandHinweis =
    document.getElementById("bestandHinweis");

function bestandHinweisAnzeigen(bestand){

    clearTimeout(bestandHinweisTimeout);
    bestandHinweis.textContent =
        "Bereits erfasst mit Bestand " + bestand +
        ". Das Bestandsfeld wurde vorausgefüllt.";
    bestandHinweis.hidden = false;
    bestandHinweisTimeout = setTimeout(() => {
        bestandHinweis.hidden = true;
        bestandHinweis.textContent = "";
    }, 5000);
}

function bestandHinweisAusblenden(){

    clearTimeout(bestandHinweisTimeout);
    bestandHinweisTimeout = null;
    bestandHinweis.hidden = true;
    bestandHinweis.textContent = "";
}

function hinzufuegen(){

    const barcode =
        document.getElementById("barcode").value.trim();

    const bestandEingabe =
        document.getElementById("bestand").value;

    const bestand =
        Number(bestandEingabe);

    if(!/^\d{8}$/.test(barcode) || bestandEingabe === "" || isNaN(bestand)){
        return;
    }

    let vorhanden =
        artikel.find(a => a.barcode === barcode);

    if(vorhanden){
        vorhanden.bestand = bestand;
    }
    else{
        artikel.push({
            barcode: barcode,
            bestand: bestand
        });
    }

    statistikErfassen(barcode, bestand);
    localStorage.setItem("artikel", JSON.stringify(artikel));
    
    anzeigeAktualisieren();

    document.getElementById("barcode").value = "";
    document.getElementById("bestand").value = "";
    bestandHinweisAusblenden();
    bestandAusstehend = false;
    document.getElementById("bestand").disabled = true;
    scannerFreigebenNachErfassung();
}

function anzeigeAktualisieren(){

    const daten =
        document.getElementById("daten");

    daten.replaceChildren();

    artikel.forEach((a, index) => {

        const zeile = document.createElement("tr");
        const barcodeZelle = document.createElement("td");
        const bestandZelle = document.createElement("td");
        const aktionZelle = document.createElement("td");
        const loeschenButton = document.createElement("button");

        barcodeZelle.textContent = a.barcode;
        bestandZelle.textContent = a.bestand;
        loeschenButton.textContent = "Löschen";
        loeschenButton.addEventListener("click", () => loeschen(index));

        aktionZelle.appendChild(loeschenButton);
        zeile.append(barcodeZelle, bestandZelle, aktionZelle);
        daten.appendChild(zeile);
    });
}

function loeschen(index){

    artikel.splice(index, 1);

    localStorage.setItem("artikel", JSON.stringify(artikel));
    anzeigeAktualisieren();
}

function csvExport(){

    let csv = "Artikelnummer;Bestand\n";

    artikel.forEach(a => {

        csv +=
            a.barcode + ";" +
            a.bestand + "\n";

    });

    const jetzt = new Date();
    const zeitstempel =
        jetzt.getFullYear() + "_" +
        String(jetzt.getMonth() + 1).padStart(2, "0") + "_" +
        String(jetzt.getDate()).padStart(2, "0") + "_" +
        String(jetzt.getHours()).padStart(2, "0") + "h_" +
        String(jetzt.getMinutes()).padStart(2, "0") + "min";

    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "bestand_" + zeitstempel + ".csv";

    link.click();

    URL.revokeObjectURL(link.href);
}

const alleEintraegeLoeschenDialog =
    document.getElementById("alleEintraegeLoeschenDialog");

document
.getElementById("alleEintraegeLoeschenButton")
.addEventListener("click", function(){
    document.getElementById("csvVorLoeschen").checked = false;
    alleEintraegeLoeschenDialog.showModal();
});

document
.getElementById("loeschenAbbrechenButton")
.addEventListener("click", function(){
    alleEintraegeLoeschenDialog.close();
});

document
.getElementById("alleEintraegeLoeschenForm")
.addEventListener("submit", function(event){
    event.preventDefault();

    if(document.getElementById("csvVorLoeschen").checked){
        csvExport();
    }

    artikel = [];
    localStorage.removeItem("artikel");
    anzeigeAktualisieren();
    alleEintraegeLoeschenDialog.close();
});

document
.getElementById("statistikZuruecksetzenButton")
.addEventListener("click", function(){
    statistik = {
        artikel: 0,
        gesamtbestand: 0,
        erfassteBarcodes: [],
        bestandJeBarcode: {},
    };
    statistikSpeichern();
});

document
.getElementById("bestand")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        hinzufuegen();
    }

});

function scannerSperren(videoAnhalten = true){

    if(html5QrCode.getState() === Html5QrcodeScannerState.SCANNING){
        html5QrCode.pause(videoAnhalten);
    }
}

function scannerFreigeben(){

    if(scannerSperrzeitAktiv){
        return;
    }

    if(html5QrCode.getState() === Html5QrcodeScannerState.PAUSED){
        html5QrCode.resume();
    }
}

function scannerFreigebenNachErfassung(){

    clearTimeout(scannerFreigabeTimeout);
    scannerSperrzeitAktiv = true;

    if(html5QrCode.getState() === Html5QrcodeScannerState.PAUSED){
        html5QrCode.resume();
    }

    scannerSperren(false);

    scannerFreigabeTimeout = setTimeout(() => {
        scannerFreigabeTimeout = null;
        scannerSperrzeitAktiv = false;

        if(!bestandAusstehend &&
            document.activeElement !== document.getElementById("barcode")){
            scannerFreigeben();
        }
    }, scannerSperrzeitDauer);
}

function bestandseingabeVorbereiten(barcode){

    bestandAusstehend = true;

    const vorhanden = artikel.find(a => a.barcode === barcode);
    const bestandFeld = document.getElementById("bestand");
    bestandFeld.value = vorhanden ? vorhanden.bestand : "";
    if(vorhanden){
        bestandHinweisAnzeigen(vorhanden.bestand);
    }
    else{
        bestandHinweisAusblenden();
    }
    bestandFeld.disabled = false;
    bestandFeld.focus();
}

async function lichtUmschalten(){

    if(!blitzlicht){
        return;
    }

    const neuerStatus = !lichtEingeschaltet;
    const lichtButton = document.getElementById("lichtButton");
    const lichtStatus = document.getElementById("lichtStatus");
    lichtButton.disabled = true;
    lichtStatus.textContent = "";

    try{
        await blitzlicht.apply(neuerStatus);
        lichtEingeschaltet = neuerStatus;
        lichtButton.textContent = lichtEingeschaltet
            ? "Licht ausschalten"
            : "Licht einschalten";
        lichtButton.setAttribute("aria-pressed", String(lichtEingeschaltet));
    }
    catch(err){
        console.error("Kameralicht konnte nicht geändert werden:", err);
        lichtStatus.textContent = "Kameralicht konnte nicht geändert werden.";
    }
    finally{
        lichtButton.disabled = false;
    }
}

document
.getElementById("lichtButton")
.addEventListener("click", lichtUmschalten);
document
.getElementById("barcode")
.addEventListener("focus", function(){
    scannerSperren();
});

document
.getElementById("barcode")
.addEventListener("input", function(){

    this.value = this.value.replace(/\D/g, "").slice(0, 8);

    if(/^\d{8}$/.test(this.value)){
        bestandseingabeVorbereiten(this.value);
    }
    else{
        bestandAusstehend = false;
        bestandHinweisAusblenden();
        document.getElementById("bestand").disabled = true;
    }
});

document
.getElementById("barcode")
.addEventListener("blur", function(){

    if(!bestandAusstehend){
        scannerFreigeben();
    }
});

function scannerErfolg(decodedText){

    if(bestandAusstehend || scannerSperrzeitAktiv){
        return;
    }

    const barcode = decodedText.trim();

    if(!/^\d{8}$/.test(barcode)){
        return;
    }

    bestandAusstehend = true;
    scannerSperren();
    document.getElementById("barcode").value = barcode;
    bestandseingabeVorbereiten(barcode);
}

function kameraLayoutAktualisieren(video){

    const viewfinder =
        document.getElementById("reader");
    const frameWidth =
        viewfinder.clientWidth;
    const frameHeight =
        viewfinder.clientHeight;
    const videoWidth =
        video.videoWidth;
    const videoHeight =
        video.videoHeight;

    if(!frameWidth || !frameHeight || !videoWidth || !videoHeight){
        return;
    }

    const scale =
        Math.max(frameWidth / videoWidth, frameHeight / videoHeight);
    const renderedWidth =
        videoWidth * scale;
    const renderedHeight =
        videoHeight * scale;
    const offsetX =
        (frameWidth - renderedWidth) / 2;
    const offsetY =
        (frameHeight - renderedHeight) / 2;

    video.style.position = "absolute";
    video.style.width = renderedWidth + "px";
    video.style.height = renderedHeight + "px";
    video.style.left = offsetX + "px";
    video.style.top = offsetY + "px";
    video.style.right = "auto";
    video.style.bottom = "auto";
    video.style.objectFit = "fill";

    const qrShadedRegion =
        document.getElementById("qr-shaded-region");

    if(qrShadedRegion){
        qrShadedRegion.style.left = offsetX + "px";
        qrShadedRegion.style.top = offsetY + "px";
        qrShadedRegion.style.right = "auto";
        qrShadedRegion.style.bottom = "auto";
        qrShadedRegion.style.width = renderedWidth + "px";
        qrShadedRegion.style.height = renderedHeight + "px";
    }
}

function qrboxFunction(viewfinderWidth, viewfinderHeight){

    const viewfinder =
        document.getElementById("reader");
    const visibleWidth =
        viewfinder.clientWidth || viewfinderWidth;
    const visibleHeight =
        viewfinder.clientHeight || viewfinderHeight;
    return {
        width: Math.floor(visibleWidth * 0.8),
        height: Math.floor(visibleHeight * 0.8),
    };
}

const readerElement =
    document.getElementById("reader");
const beobachteteVideos =
    new WeakSet();

const kameraLayoutBeobachter =
    new MutationObserver(() => {
        const video = readerElement.querySelector("video");

        if(!video){
            return;
        }

        if(!beobachteteVideos.has(video)){
            beobachteteVideos.add(video);
            video.addEventListener("loadedmetadata", () =>
                kameraLayoutAktualisieren(video));
            video.addEventListener("resize", () =>
                kameraLayoutAktualisieren(video));
        }

        kameraLayoutAktualisieren(video);
    });

kameraLayoutBeobachter.observe(readerElement, {
    childList: true,
});

window.addEventListener("resize", function(){
    const video = readerElement.querySelector("video");

    if(video){
        kameraLayoutAktualisieren(video);
    }
});

const html5QrCode =
    new Html5Qrcode("reader", {
        formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
        ],
    });

html5QrCode.start(
    { facingMode: "environment" },
    {
        fps: 20,
        qrbox: qrboxFunction,
    },
    scannerErfolg
).then(() => {
    const lichtButton = document.getElementById("lichtButton");
    const lichtStatus = document.getElementById("lichtStatus");
    readerElement.appendChild(bestandHinweis);
    const video = document.querySelector("#reader video");

    if(video){
        kameraLayoutAktualisieren(video);
    }

    blitzlicht = html5QrCode
        .getRunningTrackCameraCapabilities()
        .torchFeature();

    if(blitzlicht.isSupported()){
        lichtEingeschaltet = blitzlicht.value() === true;
        lichtButton.disabled = false;
        lichtButton.textContent = lichtEingeschaltet
            ? "Licht ausschalten"
            : "Licht einschalten";
        lichtButton.setAttribute("aria-pressed", String(lichtEingeschaltet));
    }
    if(scannerSperrzeitAktiv){
        scannerSperren(false);
    }
    else if(bestandAusstehend ||
        document.activeElement === document.getElementById("barcode")){
        scannerSperren();
    }
}).catch(err => {
    console.error(err);
});

</script>

</body>
</html>
