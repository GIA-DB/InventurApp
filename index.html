<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestandserfassung</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

input{
    padding:10px;
    margin:10px 0;
    width:100%;
    box-sizing:border-box;
}

button{
    padding:10px;
    margin:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

td,th{
    border:1px solid #ccc;
    padding:8px;
}

#reader{
    max-width:400px;
}
</style>
</head>

<body>

<h1>Bestandserfassung</h1>

<h2>Barcode scannen</h2>

<div id="reader"></div>

<label>Barcode</label>
<input id="barcode" type="text" inputmode="numeric" maxlength="8" autocomplete="off">

<label>Bestand</label>
<input id="bestand" type="number" min="0" disabled>

<button onclick="hinzufuegen()">
    Hinzufügen
</button>

<button onclick="csvExport()">
    CSV Export
</button>

<button id="lichtButton" type="button" disabled>
    Licht nicht verfügbar
</button>

<span id="lichtStatus" aria-live="polite"></span>

<table>
    <thead>
        <tr>
            <th>Barcode</th>
            <th>Bestand</th>
            <th>Aktion</th>
        </tr>
    </thead>

    <tbody id="daten">

    </tbody>
</table>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>

let artikel = JSON.parse(localStorage.getItem("artikel")) || [];

anzeigeAktualisieren();

let bestandAusstehend = false;
let blitzlicht = null;
let lichtEingeschaltet = false;

function hinzufuegen(){

    const barcode =
        document.getElementById("barcode").value.trim();

    const bestandEingabe =
        document.getElementById("bestand").value;

    const bestand =
        Number(bestandEingabe);

    if(!/^\d{8}$/.test(barcode) || bestandEingabe === "" || isNaN(bestand)){
        return;
    }

    let vorhanden =
        artikel.find(a => a.barcode === barcode);

    if(vorhanden){
        vorhanden.bestand += bestand;
    }
    else{
        artikel.push({
            barcode: barcode,
            bestand: bestand
        });
    }

    localStorage.setItem("artikel", JSON.stringify(artikel));
    
    anzeigeAktualisieren();

    document.getElementById("barcode").value = "";
    document.getElementById("bestand").value = "";
    bestandAusstehend = false;
    document.getElementById("bestand").disabled = true;
    scannerFreigeben();
}

function anzeigeAktualisieren(){

    const daten =
        document.getElementById("daten");

    daten.replaceChildren();

    artikel.forEach((a, index) => {

        const zeile = document.createElement("tr");
        const barcodeZelle = document.createElement("td");
        const bestandZelle = document.createElement("td");
        const aktionZelle = document.createElement("td");
        const loeschenButton = document.createElement("button");

        barcodeZelle.textContent = a.barcode;
        bestandZelle.textContent = a.bestand;
        loeschenButton.textContent = "Löschen";
        loeschenButton.addEventListener("click", () => loeschen(index));

        aktionZelle.appendChild(loeschenButton);
        zeile.append(barcodeZelle, bestandZelle, aktionZelle);
        daten.appendChild(zeile);
    });
}

function loeschen(index){

    artikel.splice(index, 1);

    localStorage.setItem("artikel", JSON.stringify(artikel));
    anzeigeAktualisieren();
}

function csvExport(){

    let csv = "Barcode;Bestand\n";

    artikel.forEach(a => {

        csv +=
            a.barcode + ";" +
            a.bestand + "\n";

    });

    const jetzt = new Date();
    const zeitstempel =
        jetzt.getFullYear() + "_" +
        String(jetzt.getMonth() + 1).padStart(2, "0") + "_" +
        String(jetzt.getDate()).padStart(2, "0") + "_" +
        String(jetzt.getHours()).padStart(2, "0") + "h_" +
        String(jetzt.getMinutes()).padStart(2, "0") + "min";

    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "bestand_" + zeitstempel + ".csv";

    link.click();

    URL.revokeObjectURL(link.href);
}

document
.getElementById("bestand")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        hinzufuegen();
    }

});

function scannerSperren(){

    if(html5QrCode.getState() === Html5QrcodeScannerState.SCANNING){
        html5QrCode.pause(true);
    }
}

function scannerFreigeben(){

    if(html5QrCode.getState() === Html5QrcodeScannerState.PAUSED){
        html5QrCode.resume();
    }
}

async function lichtUmschalten(){

    if(!blitzlicht){
        return;
    }

    const neuerStatus = !lichtEingeschaltet;
    const lichtButton = document.getElementById("lichtButton");
    const lichtStatus = document.getElementById("lichtStatus");
    lichtButton.disabled = true;
    lichtStatus.textContent = "";

    try{
        await blitzlicht.apply(neuerStatus);
        lichtEingeschaltet = neuerStatus;
        lichtButton.textContent = lichtEingeschaltet
            ? "Licht ausschalten"
            : "Licht einschalten";
        lichtButton.setAttribute("aria-pressed", String(lichtEingeschaltet));
    }
    catch(err){
        console.error("Kameralicht konnte nicht geändert werden:", err);
        lichtStatus.textContent = "Kameralicht konnte nicht geändert werden.";
    }
    finally{
        lichtButton.disabled = false;
    }
}

document
.getElementById("lichtButton")
.addEventListener("click", lichtUmschalten);

document
.getElementById("barcode")
.addEventListener("focus", function(){
    scannerSperren();
});

document
.getElementById("barcode")
.addEventListener("input", function(){

    this.value = this.value.replace(/\D/g, "").slice(0, 8);

    if(/^\d{8}$/.test(this.value)){
        bestandAusstehend = true;
        const bestandFeld = document.getElementById("bestand");
        bestandFeld.disabled = false;
        bestandFeld.focus();
    }
    else{
        bestandAusstehend = false;
        document.getElementById("bestand").disabled = true;
    }
});

document
.getElementById("barcode")
.addEventListener("blur", function(){

    if(!bestandAusstehend){
        scannerFreigeben();
    }
});

function scannerErfolg(decodedText){

    if(bestandAusstehend){
        return;
    }

    const barcode = decodedText.trim();

    if(!/^\d{8}$/.test(barcode)){
        return;
    }

    bestandAusstehend = true;
    scannerSperren();
    document.getElementById("barcode").value = barcode;

    const bestandFeld = document.getElementById("bestand");
    bestandFeld.disabled = false;
    bestandFeld.focus();
}

const html5QrCode =
    new Html5Qrcode("reader", {
        formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
        ],
    });

html5QrCode.start(
    { facingMode: "environment" },
    {
        fps: 20,
        qrbox: 250,
    },
    scannerErfolg
).then(() => {
    const lichtButton = document.getElementById("lichtButton");
    const lichtStatus = document.getElementById("lichtStatus");
    blitzlicht = html5QrCode
        .getRunningTrackCameraCapabilities()
        .torchFeature();

    if(blitzlicht.isSupported()){
        lichtEingeschaltet = blitzlicht.value() === true;
        lichtButton.disabled = false;
        lichtButton.textContent = lichtEingeschaltet
            ? "Licht ausschalten"
            : "Licht einschalten";
        lichtButton.setAttribute("aria-pressed", String(lichtEingeschaltet));
    }
    else{
        lichtStatus.textContent = "Dieses Gerät unterstützt kein Kameralicht.";
    }

    if(bestandAusstehend ||
        document.activeElement === document.getElementById("barcode")){
        scannerSperren();
    }
}).catch(err => {
    console.error(err);
});

</script>

</body>
</html>
